<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#e9e6df" />
    <meta
      name="description"
      content="Overtone, an interactive study of filaments and sound by Alberto Delgado."
    />
    <title>Overtone · Alberto Delgado</title>
    <link
      rel="preload"
      href="./fonts/instrument-serif-italic.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="./style.css?v=overtone" />
  </head>
  <body>
    <header class="masthead">
      <span class="artist">Alberto Delgado</span>
      <nav aria-label="Elsewhere">
        <a href="https://cronicas.io/">Crónicas</a>
        <a href="https://yames.app/">Yames</a>
        <a href="https://github.com/turutupa"
          >GitHub <span aria-hidden="true">↗</span></a
        >
      </nav>
    </header>
    <main aria-labelledby="title">
      <figure class="work">
        <div id="plate">
          <img
            id="poster"
            src="./overtone.webp"
            width="1942"
            height="809"
            alt="A ribbon of parallel dark metal filaments twists over pale paper. Light catches the open strands and falls away inside the fold."
            fetchpriority="high"
            draggable="false"
          />
          <canvas id="scene" aria-hidden="true"></canvas>
        </div>
        <figcaption>
          <h1 id="title">Overtone</h1>
          <div class="instrument">
            <p id="instructions">
              Drag across the filaments. With sound on, you’ll hear the two
              pitches slip out of unison.
            </p>
            <div class="controls">
              <div class="tuning">
                <div class="reading">
                  <label for="detune">Detune</label>
                  <span class="value"
                    ><output for="detune" data-cents aria-live="off">00</output>
                    ¢</span
                  >
                </div>
                <input
                  id="detune"
                  type="range"
                  data-detune
                  min="-30"
                  max="30"
                  step="1"
                  value="0"
                  aria-describedby="range-help"
                />
                <span class="sr-only" id="range-help"
                  >Measured in cents. Use the arrow keys to adjust. Press 0 to
                  return to unison.</span
                >
              </div>
              <button
                class="sound"
                type="button"
                data-sound
                aria-pressed="false"
              >
                <span data-sound-label>Sound off</span>
              </button>
            </div>
          </div>
        </figcaption>
      </figure>
    </main>
    <script type="module" src="./app.js?v=overtone"></script>
  </body>
</html>
